<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Alejandro Magno, creador de contenido y autor de IRREEMPLAZABLE."
    />
    <title>Alejandro Magno | Autor y creador de contenido</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121212'/%3E%3Cpath d='M18 46 32 16l14 30h-7l-2.8-6H27.5l-2.7 6H18Zm12-12h4l-2-5-2 5Z' fill='%23c79a52'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --background: #121212;
        --ivory: #f2e8d8;
        --muted: #b8b0a4;
        --gold: #c79a52;
        --gold-soft: rgb(199 154 82 / 42%);
        --line: rgb(242 232 216 / 14%);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--background);
        color: var(--ivory);
        font-family: Arial, Helvetica, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        background: var(--background);
      }

      a {
        color: inherit;
      }

      .profile-page {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        padding: clamp(1.5rem, 5vh, 3.5rem) 1.25rem;
        background:
          radial-gradient(circle at 50% -20%, rgb(199 154 82 / 10%), transparent 39%),
          linear-gradient(180deg, #141414 0%, var(--background) 42%, #101010 100%);
      }

      .profile-page::before {
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
        content: "";
        opacity: 0.035;
        pointer-events: none;
      }

      .ambient {
        position: fixed;
        z-index: -1;
        width: 18rem;
        height: 18rem;
        border: 1px solid rgb(199 154 82 / 8%);
        border-radius: 50%;
        pointer-events: none;
      }

      .ambient-top {
        top: -12rem;
        right: -8rem;
      }

      .ambient-bottom {
        bottom: -14rem;
        left: -10rem;
      }

      .digital-card {
        width: min(100%, 24rem);
        text-align: center;
      }

      .portrait-shell {
        display: inline-grid;
        width: clamp(7rem, 27vw, 8.5rem);
        aspect-ratio: 1;
        place-items: center;
        padding: 3px;
        border-radius: 50%;
        background: linear-gradient(145deg, rgb(199 154 82 / 86%), rgb(199 154 82 / 12%) 68%);
        box-shadow: 0 1.4rem 4rem rgb(0 0 0 / 34%);
      }

      .portrait {
        display: block;
        width: 100%;
        height: 100%;
        border: 3px solid var(--background);
        border-radius: 50%;
        object-fit: cover;
      }

      .identity {
        margin-top: 1.5rem;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.15rem, 10vw, 3rem);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 0.98;
      }

      .role {
        max-width: 22rem;
        margin: 0.8rem auto 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .role span {
        margin-inline: 0.22rem;
        color: var(--gold);
      }

      .signature {
        margin: 2.15rem auto 1.8rem;
      }

      .signature-mark {
        display: block;
        width: 2.5rem;
        height: 1px;
        margin: 0 auto 1rem;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }

      .signature p {
        max-width: 20rem;
        margin: 0 auto;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.3rem, 6vw, 1.6rem);
        font-style: italic;
        line-height: 1.32;
        text-wrap: balance;
      }

      .link-list {
        display: grid;
        gap: 0.72rem;
      }

      .profile-link {
        display: grid;
        min-height: 3.7rem;
        grid-template-columns: 1.45rem 1fr 1.45rem;
        align-items: center;
        gap: 0.8rem;
        padding: 0.9rem 1.05rem;
        border: 1px solid var(--line);
        border-radius: 0.9rem;
        background: linear-gradient(180deg, rgb(255 255 255 / 3.6%), rgb(255 255 255 / 1.8%));
        box-shadow: inset 0 1px rgb(255 255 255 / 2%);
        color: var(--ivory);
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.035em;
        text-align: left;
        text-decoration: none;
        transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
      }

      .profile-link svg {
        width: 1.25rem;
        height: 1.25rem;
        color: var(--gold);
      }

      .profile-link:hover {
        border-color: var(--gold-soft);
        background: rgb(199 154 82 / 7%);
        transform: translateY(-1px);
      }

      .profile-link:active {
        transform: translateY(0);
      }

      .profile-link:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .link-arrow {
        color: var(--muted);
        font-size: 1.05rem;
        text-align: right;
      }

      footer {
        margin-top: 1.8rem;
      }

      footer p {
        margin: 0;
        color: rgb(242 232 216 / 52%);
        font-size: 0.78rem;
        letter-spacing: 0.065em;
      }

      @media (max-height: 760px) and (min-width: 360px) {
        .profile-page {
          align-items: start;
          overflow-y: auto;
          padding-block: 1.25rem;
        }

        .portrait-shell {
          width: 6.5rem;
        }

        .identity {
          margin-top: 1rem;
        }

        .signature {
          margin-block: 1.35rem 1.2rem;
        }

        .profile-link {
          min-height: 3.35rem;
        }

        footer {
          margin-top: 1.25rem;
        }
      }

      @media (min-width: 48rem) {
        .profile-page {
          padding: 4rem 2rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .profile-link {
          transition: none;
        }
      }
    </style>
  </head>
