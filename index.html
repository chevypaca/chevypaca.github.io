<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Alejandro Magno, creador de contenido y autor de IRREEMPLAZABLE."
    />
    <title>Alejandro Magno | Autor y creador de contenido</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121212'/%3E%3Cpath d='M18 46 32 16l14 30h-7l-2.8-6H27.5l-2.7 6H18Zm12-12h4l-2-5-2 5Z' fill='%23c79a52'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --background: #121212;
        --ivory: #f2e8d8;
        --muted: #b8b0a4;
        --gold: #c79a52;
        --gold-soft: rgb(199 154 82 / 42%);
        --line: rgb(242 232 216 / 14%);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--background);
        color: var(--ivory);
        font-family: Arial, Helvetica, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        background: var(--background);
      }

      a {
        color: inherit;
      }

      .profile-page {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        padding: clamp(1.5rem, 5vh, 3.5rem) 1.25rem;
        background:
          radial-gradient(circle at 50% -20%, rgb(199 154 82 / 10%), transparent 39%),
          linear-gradient(180deg, #141414 0%, var(--background) 42%, #101010 100%);
      }

      .profile-page::before {
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
        content: "";
        opacity: 0.035;
        pointer-events: none;
      }

      .ambient {
        position: fixed;
        z-index: -1;
        width: 18rem;
        height: 18rem;
        border: 1px solid rgb(199 154 82 / 8%);
        border-radius: 50%;
        pointer-events: none;
      }

      .ambient-top {
        top: -12rem;
        right: -8rem;
      }

      .ambient-bottom {
        bottom: -14rem;
        left: -10rem;
      }

      .digital-card {
        width: min(100%, 24rem);
        text-align: center;
      }

      .portrait-shell {
        display: inline-grid;
        width: clamp(7rem, 27vw, 8.5rem);
        aspect-ratio: 1;
        place-items: center;
        padding: 3px;
        border-radius: 50%;
        background: linear-gradient(145deg, rgb(199 154 82 / 86%), rgb(199 154 82 / 12%) 68%);
        box-shadow: 0 1.4rem 4rem rgb(0 0 0 / 34%);
      }

      .portrait {
        display: block;
        width: 100%;
        height: 100%;
        border: 3px solid var(--background);
        border-radius: 50%;
        object-fit: cover;
      }

      .identity {
        margin-top: 1.5rem;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.15rem, 10vw, 3rem);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 0.98;
      }

      .role {
        max-width: 22rem;
        margin: 0.8rem auto 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .role span {
        margin-inline: 0.22rem;
        color: var(--gold);
      }

      .signature {
        margin: 2.15rem auto 1.8rem;
      }

      .signature-mark {
        display: block;
        width: 2.5rem;
        height: 1px;
        margin: 0 auto 1rem;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }

      .signature p {
        max-width: 20rem;
        margin: 0 auto;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.3rem, 6vw, 1.6rem);
        font-style: italic;
        line-height: 1.32;
        text-wrap: balance;
      }

      .link-list {
        display: grid;
        gap: 0.72rem;
      }

      .profile-link {
        display: grid;
        min-height: 3.7rem;
        grid-template-columns: 1.45rem 1fr 1.45rem;
        align-items: center;
        gap: 0.8rem;
        padding: 0.9rem 1.05rem;
        border: 1px solid var(--line);
        border-radius: 0.9rem;
        background: linear-gradient(180deg, rgb(255 255 255 / 3.6%), rgb(255 255 255 / 1.8%));
        box-shadow: inset 0 1px rgb(255 255 255 / 2%);
        color: var(--ivory);
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.035em;
        text-align: left;
        text-decoration: none;
        transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
      }

      .profile-link svg {
        width: 1.25rem;
        height: 1.25rem;
        color: var(--gold);
      }

      .profile-link:hover {
        border-color: var(--gold-soft);
        background: rgb(199 154 82 / 7%);
        transform: translateY(-1px);
      }

      .profile-link:active {
        transform: translateY(0);
      }

      .profile-link:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .link-arrow {
        color: var(--muted);
        font-size: 1.05rem;
        text-align: right;
      }

      footer {
        margin-top: 1.8rem;
      }

      footer p {
        margin: 0;
        color: rgb(242 232 216 / 52%);
        font-size: 0.78rem;
        letter-spacing: 0.065em;
      }

      @media (max-height: 760px) and (min-width: 360px) {
        .profile-page {
          align-items: start;
          overflow-y: auto;
          padding-block: 1.25rem;
        }

        .portrait-shell {
          width: 6.5rem;
        }

        .identity {
          margin-top: 1rem;
        }

        .signature {
          margin-block: 1.35rem 1.2rem;
        }

        .profile-link {
          min-height: 3.35rem;
        }

        footer {
          margin-top: 1.25rem;
        }
      }

      @media (min-width: 48rem) {
        .profile-page {
          padding: 4rem 2rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .profile-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="profile-page">
      <div class="ambient ambient-top" aria-hidden="true"></div>
      <div class="ambient ambient-bottom" aria-hidden="true"></div>

      <article class="digital-card" aria-labelledby="profile-name">
        <div class="portrait-shell">
          <img
            class="portrait"
            src="alejandro-magno.webp"
            alt="Retrato de Alejandro Magno"
            width="720"
            height="720"
            fetchpriority="high"
          />
        </div>

        <header class="identity">
          <h1 id="profile-name">Alejandro Magno</h1>
          <p class="role">
            creador de contenido <span aria-hidden="true">·</span> autor de irreemplazable
          </p>
        </header>

        <div class="signature" aria-label="Frase de Alejandro Magno">
          <span class="signature-mark" aria-hidden="true"></span>
          <p>no hay vidas genéricas, tampoco la tuya</p>
        </div>

        <nav class="link-list" aria-label="Enlaces de Alejandro Magno">
          <a class="profile-link" href="https://www.youtube.com/@alejandromagnoautor" target="_blank" rel="noreferrer noopener" aria-label="Abrir YouTube de Alejandro Magno">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>
            <span>YouTube</span><span class="link-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="profile-link" href="https://www.instagram.com/alejandromagnoautor/" target="_blank" rel="noreferrer noopener" aria-label="Abrir Instagram de Alejandro Magno">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"></path><circle cx="12" cy="13" r="3"></circle></svg>
            <span>Instagram</span><span class="link-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="profile-link" href="https://www.tiktok.com/@alejandromagnoautor" target="_blank" rel="noreferrer noopener" aria-label="Abrir TikTok de Alejandro Magno">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="18" r="4"></circle><path d="M12 18V2l7 4"></path></svg>
            <span>TikTok</span><span class="link-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="profile-link" href="https://www.amazon.com/dp/B0H9LWCL2Z" target="_blank" rel="noreferrer noopener" aria-label="Abrir IRREEMPLAZABLE de Alejandro Magno">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"></path><path d="M20.001 19A2 2 0 0 0 22 17V5a2 2 0 0 0-1.999-2L16 3.002A5 5 0 0 0 12 5a5 5 0 0 0-4-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 1.999 2H8a5 5 0 0 1 4 2 5 5 0 0 1 4-2z"></path></svg>
            <span>IRREEMPLAZABLE</span><span class="link-arrow" aria-hidden="true">↗</span>
          </a>
        </nav>

        <footer><p>@alejandromagnoautor</p></footer>
      </article>
    </main>
  </body>
</html>
